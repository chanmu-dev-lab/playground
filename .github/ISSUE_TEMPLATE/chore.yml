name: '⚙️Chore'
description: '설정, 리팩토링, 기타 작업'
title: '[Chore] '
labels: ['chore']
body:
  - type: input
    id: summary
    attributes:
      label: 작업 요약
      placeholder: 예) ??? 코드 작성
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 작업 이유
      placeholder: |
        예)
        - 코드 가독성 개선
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: 작업 내용
      placeholder: |
        - ???을 ???하는 작업 진행
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
